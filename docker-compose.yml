services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-gemini}
      MODEL_NAME: ${MODEL_NAME:-gemini-3.1-flash-lite}
      DATABASE_PATH: /app/data/cpa-copilot.sqlite
    volumes:
      - cpa-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  cpa-data: